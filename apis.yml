description: 'Tactile Games is a Danish mobile game studio headquartered in Copenhagen,
  founded in 2014, that builds and publishes casual free-to-play puzzle titles for
  iOS and Android. Its portfolio includes Lily''s Garden, Penny & Flo, Makeover Match,
  the Cookie Cats series (Cookie Cats, Cookie Cats Pop, Cookie Cats Blast), and the
  Simon''s Cat games. Tactile is a portfolio company of Index Ventures. It is a
  consumer game publisher rather than an API producer: it exposes no public developer
  API, SDK, or developer portal, so this profile captures the company identity,
  public web properties, and domain-security posture surfaced by the enrichment
  pipeline.'
